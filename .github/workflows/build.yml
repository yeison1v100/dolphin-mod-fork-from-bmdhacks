
name: Build Dolphin Android (mali-custom-driver)

on:
  workflow_dispatch:
  push:
    branches: [mali-custom-driver]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Checkout con submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Aceptar licencias del Android SDK (ya viene preinstalado)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4
        with:
          # El jar "desconocido" está en Externals/SDL (submódulo), no se usa en el build
          validate-wrappers: false

      - name: Compilar APK debug
        working-directory: Source/Android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-mali-custom-driver-debug
          path: Source/Android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
